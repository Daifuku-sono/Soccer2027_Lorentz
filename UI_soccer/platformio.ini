[env:pico]
platform = raspberrypi
board = pico
framework = arduino

upload_port = COM3

; TFT_eSPI ライブラリの自動インストール指定
lib_deps =
    bodmer/TFT_eSPI @ ^2.5.43

; TFT_eSPI の設定をすべてここに集約（User_Setup.h の代わりに適用されます）
build_flags =
    -D USER_SETUP_LOADED=1         ; カスタム設定を強制有効化するフラグ

    ; --- ドライバと画面サイズ ---
    -D ST7789_DRIVER=1             ; ST7789ドライバを使用
    -D TFT_WIDTH=240
    -D TFT_HEIGHT=240
    
    ; 必要に応じて色の反転（ネガポジ反転）を切り替え
    ; -D TFT_INVERSION_ON
    ; -D TFT_INVERSION_OFF

    ; --- RP2040 (Pico) SPI0のピンアサイン ---
    -D TFT_MISO=-1
    -D TFT_MOSI=19                 ; Pico GP19 (SPI0 TX)
    -D TFT_SCLK=18                 ; Pico GP18 (SPI0 SCK)
    -D TFT_CS=17                   ; Pico GP17
    -D TFT_DC=20                   ; Pico GP20
    -D TFT_RST=21                  ; Pico GP21

    ; --- クロック速度とフォント ---
    -D SPI_FREQUENCY=40000000      ; SPI速度: 40MHz
    -D SPI_READ_FREQUENCY=20000000
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D SMOOTH_FONT=1